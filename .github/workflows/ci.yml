name: CI

# Pull requests: typecheck, unit tests, production build, browser tests. Nothing is deployed.
# Pushes to main (and manual runs on main): the same checks, then the tested dist/ is deployed
# to GitHub Pages at /dailyboss/.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; only the deploy job gets Pages permissions.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Typecheck, unit tests, build, browser tests
    runs-on: ubuntu-latest
    # Match package-lock.json's Playwright version. Browsers and OS dependencies
    # are included, so CI does not depend on Ubuntu package mirrors at runtime.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host
    timeout-minutes: 25
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm test

      - name: Production build (base /dailyboss/)
        run: npm run build:app

      - name: Browser tests (Playwright, against dist/)
        run: npm run test:e2e:prebuilt
        env:
          # Fail instead of skipping if the runner cannot provide WebGL.
          E2E_REQUIRE_WEBGL: '1'

      - name: Upload browser test report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

      # Only main-branch runs produce a Pages artifact; it is exactly the dist/ that was tested above.
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
